# generated by colorado (theme dark); add `source-file @CFG@/tmux/colorado.conf` to tmux.conf
set -g status-style "bg=#1a222d,fg=#e2e5e9"
set -g status-left-style "bg=#1a222d,fg=#e2e5e9"
set -g window-status-style "fg=#8e9297"
set -g window-status-current-style "bg=#4f9cff,fg=#000000,bold"
set -g pane-border-style "fg=#3f444a"
set -g pane-active-border-style "fg=#4f9cff"
set -g message-style "bg=#1a222d,fg=#e2e5e9"
set -g message-command-style "bg=#1a222d,fg=#4f9cff"
set -g mode-style "bg=#4f9cff,fg=#000000"
set -g display-panes-active-colour "#4f9cff"
set -g display-panes-colour "#8e9297"
set -g clock-mode-colour "#4f9cff"
