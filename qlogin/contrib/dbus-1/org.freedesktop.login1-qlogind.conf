<!-- /usr/share/dbus-1/system.d/ (EXAMPLE, not installed). Lets user "root" own the name and anybody call it; qlogind does its own uid-based authorization.
     On a machine with systemd-logind or elogind this file competes with theirs: use it only in a VM or a spare system. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.freedesktop.login1"/>
    <allow send_destination="org.freedesktop.login1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.freedesktop.login1"/>
    <allow receive_sender="org.freedesktop.login1"/>
  </policy>
</busconfig>
