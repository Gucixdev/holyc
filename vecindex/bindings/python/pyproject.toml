[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vecindex"
version = "0.4.0"
description = "A vector database in one C file: embedded RAG storage that repairs its own damaged blocks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []
authors = [{ name = "Gucixdev" }]
keywords = ["vector database", "rag", "embeddings", "similarity search", "embedded"]
classifiers = [
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Source = "https://github.com/Gucixdev/vecindex"

[tool.setuptools]
packages = ["vecindex"]
